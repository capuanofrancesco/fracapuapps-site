<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <meta name="robots" content="noindex,nofollow">
  <title>Scarica Zefilandya Academy</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#efe5ff 0%,#fff 58%);color:#24152f;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(74,33,112,.16);padding:32px 24px;text-align:center}
    .logo{width:112px;height:112px;border-radius:24px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#5b159c;color:#ffd94a;font-size:72px;font-weight:900;box-shadow:0 8px 22px rgba(91,21,156,.25)}
    h1{margin:0 0 10px;font-size:30px}
    p{margin:0 0 24px;font-size:17px;line-height:1.45;color:#5c5064}
    .btn{display:block;width:100%;border-radius:18px;padding:19px 16px;font-size:20px;font-weight:850;text-decoration:none;background:#6f2bd8;color:#fff;box-shadow:0 8px 20px rgba(111,43,216,.22)}
    .small{margin-top:18px;font-size:13px;line-height:1.35;color:#8a8090}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Z</div>
    <h1>Zefilandya Academy</h1>
    <p>Giochi, quiz e avventure educative per bambini 6–10 anni.</p>

    <a class="btn" href="intent://details?id=com.capuanofra81.sofiaacademy#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.capuanofra81.sofiaacademy;end">
      Scarica gratis su Google Play
    </a>

    <div class="small">Un solo tocco: se TikTok non può aprire l'app Play Store, verrà mostrata automaticamente la pagina Google Play.</div>
  </main>
</body>
</html>
