<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Zefilandya Academy</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#efe5ff 0%,#faf7ff 48%,#fff 100%);
      color:#21112f;
      padding:18px 14px 34px;
    }
    .card{
      width:min(560px,100%);
      margin:0 auto;
      background:#fff;
      border-radius:30px;
      box-shadow:0 18px 55px rgba(75,34,118,.16);
      padding:24px 18px 26px;
      text-align:center;
    }
    .logo{
      width:150px;
      height:150px;
      display:block;
      margin:0 auto 12px;
      border-radius:30px;
      object-fit:cover;
      box-shadow:0 10px 26px rgba(81,29,135,.20);
    }
    h1{
      margin:0;
      font-size:clamp(34px,9vw,50px);
      line-height:1.02;
      letter-spacing:-1.5px;
      color:#271038;
    }
    .free{
      margin:10px 0 26px;
      font-size:21px;
      color:#65596c;
    }
    .step{
      display:grid;
      grid-template-columns:58px 1fr;
      gap:13px;
      align-items:center;
      text-align:left;
      margin:14px 0;
      padding:18px 15px;
      border:2px solid #eadfff;
      border-radius:20px;
      background:#fbf9ff;
    }
    .num{
      width:54px;
      height:54px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#6f2bd8;
      color:#fff;
      font-size:28px;
      font-weight:900;
    }
    .step-text{
      font-size:22px;
      line-height:1.25;
      font-weight:850;
      color:#28143a;
    }
    .dots{
      display:inline-block;
      font-size:29px;
      letter-spacing:3px;
      line-height:1;
      color:#6f2bd8;
      vertical-align:-2px;
    }
    .browser-label{
      color:#6f2bd8;
      font-weight:950;
    }
    @media(max-width:380px){
      .logo{width:125px;height:125px}
      .step{grid-template-columns:50px 1fr;padding:15px 12px}
      .num{width:46px;height:46px;font-size:24px}
      .step-text{font-size:19px}
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/zefilandya-playstore-icon.png" alt="Logo Zefilandya Academy">
    <h1>Zefilandya<br>Academy</h1>
    <p class="free">Gratis su Google Play</p>

    <div class="step">
      <div class="num">1</div>
      <div class="step-text">Tocca i <span class="dots">•••</span> <strong>3 puntini in alto a destra</strong>.</div>
    </div>

    <div class="step">
      <div class="num">2</div>
      <div class="step-text">Nel menu che si apre, tocca <span class="browser-label">“Apri nel browser”</span>.</div>
    </div>
  </main>

  <script>
    (function(){
      var ua=(navigator.userAgent||'').toLowerCase();
      var isTikTok = ua.indexOf('tiktok') !== -1 ||
                     ua.indexOf('musical_ly') !== -1 ||
                     ua.indexOf('bytedance') !== -1 ||
                     ua.indexOf('aweme') !== -1;

      var params=new URLSearchParams(window.location.search);
      var source=params.get('v') === '20260820' ? 'tiktok' : 'amici';
      var target='/zefilandya/download-compact-20260819.html?cb=' + Date.now() + '&src=' + source;

      function trackOnce(eventSource,storageKey){
        var canStore=true;
        try{
          if(sessionStorage.getItem(storageKey)==='1') return;
          sessionStorage.setItem(storageKey,'1');
        }catch(e){ canStore=false; }

        try{
          fetch('https://wylttxfpmlakfdbpulxd.supabase.co/rest/v1/zefilandya_play_clicks',{
            method:'POST',
            headers:{
              'apikey':'sb_publishable_KNbQ8LNvaUsZO1sZfhSARw_z_8-Do5T',
              'Content-Type':'application/json',
              'Prefer':'return=minimal'
            },
            body:JSON.stringify({source:eventSource}),
            keepalive:true
          }).catch(function(){
            if(canStore){ try{ sessionStorage.removeItem(storageKey); }catch(e){} }
          });
        }catch(e){
          if(canStore){ try{ sessionStorage.removeItem(storageKey); }catch(err){} }
        }
      }

      if(isTikTok){
        if(source==='tiktok'){
          trackOnce('tiktok_link','zefi_tiktok_link_counted');
        }
        try{ history.replaceState(null,'',target); }catch(e){}
      }else{
        window.location.replace(target);
      }
    })();
  </script>
</body>
</html>
