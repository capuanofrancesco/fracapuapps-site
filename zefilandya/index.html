<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <title>Zefilandya Academy</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#efe5ff 0%,#fff 58%);color:#24152f;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(520px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(74,33,112,.16);padding:32px 24px;text-align:center}
    .logo{width:112px;height:112px;border-radius:24px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:#5b159c;color:#ffd94a;font-size:72px;font-weight:900;box-shadow:0 8px 22px rgba(91,21,156,.25)}
    h1{margin:0 0 8px;font-size:30px}
    .lead{margin:0 0 22px;font-size:17px;line-height:1.45;color:#5c5064}
    .searchbox{background:#f6f1ff;border:2px solid #dac8ff;border-radius:18px;padding:16px;margin:16px 0 12px}
    .label{font-size:13px;color:#756b7b;margin-bottom:6px}
    .name{font-size:24px;font-weight:900;color:#301344;word-break:break-word}
    .btn{display:block;width:100%;border:0;border-radius:18px;padding:18px 16px;font-size:19px;font-weight:850;text-decoration:none;margin-top:12px;cursor:pointer}
    .primary{background:#6f2bd8;color:#fff;box-shadow:0 8px 20px rgba(111,43,216,.22)}
    .secondary{background:#f1e8ff;color:#5720aa}
    .note{margin-top:18px;font-size:14px;line-height:1.45;color:#756b7b}
    .ok{margin-top:10px;font-size:13px;font-weight:700;color:#1f7a44;min-height:20px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Z</div>
    <h1>Zefilandya Academy</h1>
    <p class="lead">Gratis su Google Play.</p>

    <div class="searchbox">
      <div class="label">Nel Play Store cerca:</div>
      <div class="name" id="app-name">Zefilandya Academy</div>
    </div>

    <button class="btn primary" id="copy-btn" type="button">Copia “Zefilandya Academy”</button>
    <div class="ok" id="copy-status"></div>

    <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.capuanofra81.sofiaacademy">Apri Google Play sul web</a>

    <p class="note">TikTok può bloccare l’apertura diretta dell’app Play Store. Se succede, apri il Play Store sul telefono e incolla il nome copiato.</p>
  </main>

  <script>
    const text = 'Zefilandya Academy';
    const btn = document.getElementById('copy-btn');
    const status = document.getElementById('copy-status');
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = 'Copiato ✓';
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        status.textContent = 'Copiato ✓';
      }
    });
  </script>
</body>
</html>
