<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Zefilandya Academy · Google Play</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;min-height:100%}
    body{
      min-height:100dvh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#efe6ff 0%,#faf7ff 52%,#fff 100%);
    }
    .card{
      width:min(390px,100%);
      background:#fff;
      border-radius:30px;
      box-shadow:0 18px 55px rgba(75,34,118,.16);
      padding:28px 20px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:26px;
      text-align:center;
    }
    .logo{
      width:min(170px,42vw);
      aspect-ratio:1/1;
      display:block;
      border-radius:32px;
      object-fit:cover;
      box-shadow:0 12px 28px rgba(81,29,135,.22);
    }
    .play-link{display:block;text-decoration:none;-webkit-tap-highlight-color:transparent}
    .play-link:active{transform:scale(.98)}
    .play-badge{
      display:block;
      width:min(210px,68vw);
      height:auto;
      margin:0 auto;
    }
    @media(max-height:620px){
      .card{padding:22px 18px;gap:20px}
      .logo{width:min(145px,36vw)}
      .play-badge{width:min(190px,64vw)}
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./assets/zefilandya-playstore-icon.png" alt="Zefilandya Academy">
    <a class="play-link" href="https://play.google.com/store/apps/details?id=com.capuanofra81.sofiaacademy" aria-label="Apri Zefilandya Academy su Google Play">
      <img class="play-badge" src="https://play.google.com/intl/en_us/badges/static/images/badges/it_badge_web_generic.png" alt="Disponibile su Google Play">
    </a>
  </main>
</body>
</html>
