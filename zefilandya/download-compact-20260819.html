<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Zefilandya Academy · Google Play</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:18px 14px 28px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#efe6ff 0%,#faf7ff 48%,#fff 100%);color:#241033}
    .card{width:min(520px,100%);background:#fff;border-radius:28px;padding:22px 18px 24px;text-align:center;box-shadow:0 18px 50px rgba(70,32,110,.14)}
    .logo{width:132px;height:132px;border-radius:28px;display:block;margin:0 auto 14px;object-fit:cover;box-shadow:0 10px 24px rgba(81,29,135,.20)}
    h1{margin:0;font-size:clamp(32px,8vw,44px);line-height:1.02;letter-spacing:-1.2px;font-weight:950}
    .subtitle{margin:10px 0 20px;font-size:18px;color:#6c6172;font-weight:650}
    .play-card{display:block;width:100%;max-width:380px;margin:0 auto;padding:18px 16px;border-radius:22px;background:#111;text-decoration:none;box-shadow:0 12px 28px rgba(0,0,0,.16);-webkit-tap-highlight-color:transparent}
    .play-card:active{transform:scale(.985)}
    .play-row{display:flex;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:left}
    .play-logo{width:54px;height:54px;flex:0 0 54px}
    .play-small{display:block;font-size:14px;line-height:1.05;letter-spacing:.3px;text-transform:uppercase;opacity:.92}
    .play-big{display:block;margin-top:3px;font-size:26px;line-height:1;font-weight:700;letter-spacing:-.6px}
    .hint{margin:14px 0 0;font-size:14px;line-height:1.35;color:#8e8494;font-weight:650}
    @media(max-width:380px){body{padding-top:12px}.card{padding:18px 14px 20px}.logo{width:118px;height:118px}.play-card{padding:16px 13px}.play-logo{width:46px;height:46px;flex-basis:46px}.play-big{font-size:23px}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/zefilandya-playstore-icon.png" alt="Zefilandya Academy">
    <h1>Zefilandya<br>Academy</h1>
    <p class="subtitle">Gratis su Google Play</p>
    <a id="play-store-button" class="play-card" href="https://play.google.com/store/apps/details?id=com.capuanofra81.sofiaacademy" aria-label="Apri Zefilandya Academy su Google Play">
      <div class="play-row">
        <svg class="play-logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00d26a"/><stop offset="1" stop-color="#00a8e8"/></linearGradient></defs>
          <path d="M10 6c-2 1-3 3-3 6v40c0 3 1 5 3 6l25-26L10 6z" fill="url(#g1)"/>
          <path d="M35 32 43 24 14 7c-1-.6-2-.8-3-.5L35 32z" fill="#ffd04a"/>
          <path d="M35 32 11 57.5c1 .3 2 .1 3-.5l29-17-8-8z" fill="#ff5252"/>
          <path d="M56 29 43 22l-8 10 8 10 13-7c3-2 3-4 0-6z" fill="#3b82f6"/>
        </svg>
        <span><span class="play-small">Disponibile su</span><span class="play-big">Google Play</span></span>
      </div>
    </a>
    <p class="hint">Tocca il pulsante per aprire direttamente la scheda dell'app.</p>
  </main>

  <script>
    (function(){
      var button=document.getElementById('play-store-button');
      if(!button) return;

      var params=new URLSearchParams(window.location.search);
      var source=(params.get('src')||'').toLowerCase()==='tiktok' ? 'tiktok' : 'amici';
      var flowId=(params.get('fid')||'').trim();

      function track(eventSource,eventFlowId){
        var payload={source:eventSource};
        if(eventFlowId) payload.flow_id=eventFlowId;
        try{
          fetch('https://wylttxfpmlakfdbpulxd.supabase.co/rest/v1/zefilandya_play_clicks',{
            method:'POST',
            headers:{
              'apikey':'sb_publishable_KNbQ8LNvaUsZO1sZfhSARw_z_8-Do5T',
              'Content-Type':'application/json',
              'Prefer':'return=minimal'
            },
            body:JSON.stringify(payload),
            keepalive:true
          }).catch(function(){});
        }catch(e){}
      }

      function trackBrowserOnce(){
        if(flowId){
          track('tiktok_browser',flowId);
          return;
        }

        var now=Date.now();
        try{
          var last=parseInt(localStorage.getItem('zefi_tiktok_browser_fallback_at')||'0',10)||0;
          if(now-last<5000) return;
          localStorage.setItem('zefi_tiktok_browser_fallback_at',String(now));
        }catch(e){}
        track('tiktok_browser',null);
      }

      if(source==='tiktok'){
        trackBrowserOnce();
      }

      button.addEventListener('click',function(){
        if(source==='tiktok'){
          track('tiktok',flowId||null);
        }else{
          track('amici',null);
        }
      });
    })();
  </script>
</body>
</html>
