<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Scarica Zefilandya Academy</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -12%,rgba(111,43,216,.24),transparent 35%),
        linear-gradient(180deg,#efe5ff 0%,#faf7ff 55%,#ffffff 100%);
      color:#261137;
      padding:16px 12px 24px;
    }
    .card{
      width:min(430px,100%);
      margin:0 auto;
      background:rgba(255,255,255,.98);
      border:1px solid rgba(111,43,216,.10);
      border-radius:30px;
      box-shadow:0 18px 50px rgba(70,28,112,.16);
      padding:22px 18px 20px;
      text-align:center;
      overflow:hidden;
      position:relative;
    }
    .card::after{
      content:"";
      position:absolute;
      width:180px;
      height:180px;
      border-radius:50%;
      top:-110px;
      right:-85px;
      background:rgba(111,43,216,.07);
      pointer-events:none;
    }
    .logo{
      width:122px;
      height:122px;
      display:block;
      margin:0 auto 12px;
      border-radius:26px;
      object-fit:cover;
      box-shadow:0 10px 26px rgba(81,29,135,.22);
      position:relative;
      z-index:1;
    }
    h1{
      margin:0;
      font-size:clamp(32px,8.8vw,40px);
      line-height:1.02;
      letter-spacing:-1.2px;
      font-weight:950;
      color:#261036;
    }
    .subtitle{
      margin:10px auto 16px;
      max-width:340px;
      font-size:16px;
      line-height:1.35;
      color:#6b6071;
      font-weight:650;
    }
    .mini-line{
      width:70px;
      height:4px;
      margin:0 auto 16px;
      border-radius:999px;
      background:linear-gradient(90deg,#6f2bd8,#a950ff);
    }
    .download-area{
      padding:16px 14px 15px;
      border-radius:22px;
      background:linear-gradient(180deg,#fbf8ff 0%,#f5efff 100%);
      border:1.5px solid #eadfff;
    }
    .download-kicker{
      margin:0 0 4px;
      font-size:13px;
      letter-spacing:.8px;
      text-transform:uppercase;
      color:#6f2bd8;
      font-weight:950;
    }
    .download-title{
      margin:0 0 10px;
      font-size:22px;
      line-height:1.15;
      font-weight:950;
      color:#261036;
    }
    .play-link{
      display:inline-block;
      max-width:100%;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }
    .play-link:active{transform:scale(.98)}
    .play-badge{
      display:block;
      width:220px;
      max-width:100%;
      height:auto;
      margin:0 auto;
      filter:drop-shadow(0 8px 14px rgba(39,16,56,.16));
    }
    .availability{
      margin:11px 0 0;
      font-size:13px;
      color:#756a7d;
      font-weight:700;
    }
    .availability::before{
      content:"●";
      color:#16a34a;
      margin-right:6px;
    }
    .footer{
      margin:14px 0 0;
      font-size:12px;
      color:#a095a7;
      font-weight:700;
    }
    @media(max-width:380px){
      body{padding:12px 10px 20px}
      .card{padding:18px 14px 17px;border-radius:26px}
      .logo{width:108px;height:108px;border-radius:23px}
      h1{font-size:31px}
      .subtitle{font-size:15px;margin-bottom:13px}
      .download-area{padding:14px 11px}
      .download-title{font-size:20px}
      .play-badge{width:205px}
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/zefilandya-playstore-icon.png" alt="Logo Zefilandya Academy">

    <h1>Zefilandya<br>Academy</h1>
    <p class="subtitle">Giochi, quiz e avventure educative per imparare divertendosi.</p>
    <div class="mini-line"></div>

    <section class="download-area">
      <p class="download-kicker">Gratis su Android</p>
      <p class="download-title">Scarica l'app su Google Play</p>

      <a class="play-link" href="https://play.google.com/store/apps/details?id=com.capuanofra81.sofiaacademy" aria-label="Scarica Zefilandya Academy da Google Play">
        <img class="play-badge" src="https://play.google.com/intl/en_us/badges/static/images/badges/it_badge_web_generic.png" alt="Disponibile su Google Play">
      </a>

      <p class="availability">Disponibile ora su Google Play</p>
    </section>

    <p class="footer">Zefilandya Academy · Fracapu Apps</p>
  </main>
</body>
</html>
