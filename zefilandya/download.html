<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f2bd8">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Scarica Zefilandya Academy</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 50% -10%,rgba(111,43,216,.22),transparent 38%),
        linear-gradient(180deg,#f1e8ff 0%,#faf7ff 48%,#fff 100%);
      color:#241033;
      padding:24px 14px 40px;
    }
    .card{
      width:min(560px,100%);
      margin:0 auto;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(111,43,216,.10);
      border-radius:34px;
      box-shadow:0 22px 60px rgba(74,31,118,.16);
      padding:30px 22px 32px;
      text-align:center;
      overflow:hidden;
      position:relative;
    }
    .card::before{
      content:"";
      position:absolute;
      width:240px;
      height:240px;
      border-radius:50%;
      background:rgba(111,43,216,.08);
      top:-150px;
      right:-120px;
    }
    .logo{
      width:168px;
      height:168px;
      display:block;
      margin:0 auto 18px;
      border-radius:34px;
      object-fit:cover;
      box-shadow:0 14px 32px rgba(81,29,135,.24);
      position:relative;
    }
    h1{
      margin:0;
      font-size:clamp(35px,9vw,50px);
      line-height:1.02;
      letter-spacing:-1.6px;
      font-weight:950;
      color:#271038;
    }
    .subtitle{
      margin:13px auto 20px;
      max-width:430px;
      font-size:19px;
      line-height:1.4;
      color:#6b6071;
      font-weight:650;
    }
    .badges{
      display:flex;
      justify-content:center;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:22px;
    }
    .badge{
      padding:8px 13px;
      border-radius:999px;
      background:#f3edff;
      color:#5f27b8;
      font-size:14px;
      font-weight:850;
    }
    .download-box{
      border:2px solid #eadfff;
      border-radius:26px;
      background:linear-gradient(180deg,#fdfbff,#f6efff);
      padding:22px 16px 20px;
    }
    .download-box h2{
      margin:0 0 6px;
      font-size:25px;
      line-height:1.15;
      color:#271038;
    }
    .download-box p{
      margin:0 0 17px;
      color:#756b7b;
      font-size:16px;
      line-height:1.35;
    }
    .play-link{
      display:inline-block;
      text-decoration:none;
      -webkit-tap-highlight-color:transparent;
    }
    .play-link:active{transform:scale(.97)}
    .play-badge{
      display:block;
      width:min(300px,84vw);
      height:auto;
      margin:0 auto;
      filter:drop-shadow(0 10px 18px rgba(39,16,56,.18));
    }
    .hint{
      margin:18px 0 0;
      font-size:14px;
      color:#958a9c;
      font-weight:650;
    }
    @media(max-width:380px){
      .logo{width:145px;height:145px}
      .subtitle{font-size:17px}
      .download-box h2{font-size:22px}
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="../assets/zefilandya-playstore-icon.png" alt="Logo Zefilandya Academy">
    <h1>Zefilandya<br>Academy</h1>
    <p class="subtitle">Giochi, quiz e avventure educative. Gratis su Android.</p>

    <div class="badges">
      <span class="badge">✓ Gratis</span>
      <span class="badge">Android</span>
      <span class="badge">Google Play</span>
    </div>

    <section class="download-box">
      <h2>Scarica Zefilandya Academy</h2>
      <p>Tocca il pulsante ufficiale per aprire la scheda dell'app su Google Play.</p>
      <a class="play-link" href="https://play.google.com/store/apps/details?id=com.capuanofra81.sofiaacademy" aria-label="Scarica Zefilandya Academy da Google Play">
        <img class="play-badge" src="https://play.google.com/intl/en_us/badges/static/images/badges/it_badge_web_generic.png" alt="Disponibile su Google Play">
      </a>
    </section>

    <p class="hint">Zefilandya Academy · Fracapu Apps</p>
  </main>
</body>
</html>
